<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         PER-SCHOOL EXAMPLE: JUNDA HIGH SCHOOL
         Subdomain: junda.masomoportal.co.ke
         Everything below that mentioned "Masomo Portal" generically
         now leads with the school's own name — this is the pattern
         to repeat for every school row in your registry.
         ============================================================ -->

    <title>Junda High School Student Portal | Results, Fees & Login | Masomo Portal</title>
    <meta
      name="description"
      content="Official student portal for Junda High School. Login to check exam results, fee statements, timetables and school announcements online, powered by Masomo Portal."
    />

    <!-- ============================================================
         SEO KEYWORDS
         "meta keywords" carries little weight with Google today, but
         costs nothing and is still read by some smaller search engines
         and directories — kept here as a belt-and-braces addition.
         The real keyword work is making sure these same phrases appear
         naturally in the page's visible <title>, <h1>, and body text.
         Swap "Junda High School" for the new school's name on each
         per-school build.
         ============================================================ -->
    <meta
      name="keywords"
      content="Junda High School, Junda High School portal, Junda High School student portal, Junda High School login, Junda High School results, Junda High School KCSE results, Junda High School fees, Junda High School fee statement, Junda High School timetable, Junda High School admission, Masomo Portal, school portal Kenya, student portal Kenya, high school management system Kenya"
    />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Steve Ongera" />
    <link rel="canonical" href="https://junda.masomoportal.co.ke/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Junda High School Portal" />
    <meta property="og:title" content="Junda High School Student Portal | Results, Fees & Login" />
    <meta
      property="og:description"
      content="Results, fees, timetables and announcements for Junda High School students and parents."
    />
    <meta property="og:url" content="https://junda.masomoportal.co.ke/" />
    <meta property="og:image" content="https://junda.masomoportal.co.ke/school_logo.png" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Junda High School Student Portal | Results, Fees & Login" />
    <meta
      name="twitter:description"
      content="Results, fees, timetables and announcements for Junda High School students and parents."
    />
    <meta name="twitter:image" content="https://junda.masomoportal.co.ke/school_logo.png" />

    <!-- Favicon — school's own badge, falls back to Masomo Portal mark if none supplied -->
    <link rel="icon" type="image/png" href="/school_logo.png" />
    <link rel="apple-touch-icon" href="/school_logo.png" />

    <!-- Preconnect for faster CDN asset loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- ============================================================
         STRUCTURED DATA (JSON-LD) — school-specific
         "sameAs" should point to the school's own official website or
         Facebook page if one exists — collect this during onboarding.
         "keywords" is a valid JSON-LD property too — reinforces the
         same terms for engines that parse structured data.
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Junda High School",
        "url": "https://junda.masomoportal.co.ke/",
        "sameAs": [
          "https://www.facebook.com/JundaHighSchool"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "KE"
        },
        "description": "Junda High School's official student portal, provided by Masomo Portal.",
        "keywords": "Junda High School portal, Junda High School results, Junda High School fees, Junda High School login, student portal Kenya",
        "provider": {
          "@type": "Organization",
          "name": "Masomo Portal",
          "founder": {
            "@type": "Person",
            "name": "Steve Ongera"
          }
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
