<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2f5c" />

  

    <title>Junda High School Shanzu  Masomo Portal</title>
    <meta
      name="description"
      content="Official student portal for Junda High School Shanzu. Login to check exam results, fee statements, timetables and school announcements online, powered by Masomo Portal."
    />


    <meta
      name="keywords"
      content="Junda High School, Junda High School Shanzu, Junda High School portal, Junda High School student portal, Junda High School parent portal, Junda High School login, Junda High School results, Junda High School KCSE results, Junda High School exam results, Junda High School fees, Junda High School fee statement, Junda High School fee balance, Junda High School M-Pesa payment, Junda High School timetable, Junda High School admission, Junda High School Mombasa, Junda High School Shanzu Mombasa, jundahighschool.co.ke, Masomo Portal, school portal Kenya, student portal Kenya, parent portal Kenya, high school management system Kenya, secondary school portal Kenya, CBC school portal Kenya"
    />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Steve Ongera" />
    <link rel="canonical" href="https://jundahighschool.co.ke/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Junda High School Portal" />
    <meta property="og:title" content="Junda High School Shanzu Student Portal | Results, Fees & Login" />
    <meta
      property="og:description"
      content="Results, fees, timetables and announcements for Junda High School students and parents."
    />
    <meta property="og:url" content="https://jundahighschool.co.ke/" />
    <meta property="og:image" content="https://jundahighschool.co.ke/junda_high_logo.png" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Junda High School Student Portal | Results, Fees & Login" />
    <meta
      name="twitter:description"
      content="Results, fees, timetables and announcements for Junda High School students and parents."
    />
    <meta name="twitter:image" content="https://jundahighschool.co.ke/junda_high_logo.png" />

    <!-- Favicon — school's own badge, falls back to Masomo Portal mark if none supplied -->
    <link rel="icon" type="image/png" href="/junda_high_logo.png" />
    <link rel="apple-touch-icon" href="/junda_high_logo.png" />

    <!-- Preconnect for faster CDN asset loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

   
    <style>
      html, body { margin: 0; height: 100%; background: #f3f7fc; }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f7fc;
      }
      #boot-loader .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid #e6f0fd;
        border-top-color: #1a4fa0;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

  
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Junda High School",
        "url": "https://jundahighschool.co.ke/",
        "sameAs": [
          "https://www.facebook.com/JundaHighSchool"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "KE"
        },
        "description": "Junda High School's official student portal, provided by Masomo Portal.",
        "keywords": "Junda High School portal, Junda High School results, Junda High School fees, Junda High School login, Junda High School Shanzu, student portal Kenya, parent portal Kenya",
        "provider": {
          "@type": "Organization",
          "name": "Masomo Portal",
          "founder": {
            "@type": "Person",
            "name": "Steve Ongera"
          }
        }
      }
    </script>
  </head>

  <body>
    <!-- React replaces everything inside #root the moment it mounts -->
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading Junda High School portal">
        <div class="ring"></div>
      </div>
    </div>

    <noscript>Junda High School Student Portal needs JavaScript enabled to run.</noscript>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
